# 覆盖 nav2_params.yaml：真实传感器使用系统时间。
controller_server:
  ros__parameters:
    use_sim_time: false
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker:
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    goal_checker:
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.17
      stateful: true
    FollowPath:
      min_vel_x: 0.0
      max_vel_x: 0.10
      max_vel_theta: 0.45
      min_speed_theta: 0.10
      min_speed_xy: 0.0
      max_speed_xy: 0.10
      acc_lim_x: 0.20
      acc_lim_theta: 0.60
      decel_lim_x: -0.20
      decel_lim_theta: -0.80
      vx_samples: 12
      vtheta_samples: 24
      sim_time: 1.0
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.03
      GoalAlign.scale: 0.0
      RotateToGoal.scale: 100.0
      RotateToGoal.slowing_factor: 8.0
      RotateToGoal.lookahead_time: -1.0
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      width: 2.0
      height: 2.0
      resolution: 0.02
      robot_radius: 0.12
      inflation_layer:
        inflation_radius: 0.20
        cost_scaling_factor: 8.0
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      resolution: 0.02
      robot_radius: 0.12
      inflation_layer:
        inflation_radius: 0.20
        cost_scaling_factor: 8.0
planner_server:
  ros__parameters:
    use_sim_time: false
    GridBased:
      tolerance: 0.10
behavior_server:
  ros__parameters:
    use_sim_time: false
bt_navigator:
  ros__parameters:
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    max_velocity: [0.10, 0.0, 0.8]
    min_velocity: [-0.05, 0.0, -0.8]
    max_accel: [0.20, 0.0, 1.0]
    max_decel: [-0.20, 0.0, -1.0]
    feedback: "CLOSED_LOOP"
    odom_topic: /odom
amcl:
  ros__parameters:
    use_sim_time: false
map_server:
  ros__parameters:
    use_sim_time: false
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
