# SLAM 通用层：仿真与实车都使用同一套坐标系和建图参数。
# use_sim_time 由 slam_sim.yaml / slam_real.yaml 提供。
slam_toolbox:
  ros__parameters:

    # ROS
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping

    # 建图参数
    map_update_interval: 0.5
    resolution: 0.02
    min_laser_range: 0.1
    max_laser_range: 8.0
    minimum_time_interval: 0.1

    # 回环检测
    do_loop_closing: false
    loop_search_maximum_distance: 5.0
