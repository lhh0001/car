version: '3.8'

# Docker Compose for vehicle simulation
# Usage:  docker compose up

services:
  vehicle-sim:
    build: .
    image: vehicle-sim:humble
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./src:/workspace/src:rw
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: bash
